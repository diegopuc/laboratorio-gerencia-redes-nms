# Escuta em todas as interfaces UDP porta 161
agentAddress udp:161

# Permite acesso SNMP v2c com a comunidade 'laboratorio' a toda a arvore MIB (.1)
view all included .1 80
rocommunity laboratorio default -V all

# Informacoes do Sistema (RFC1213-MIB / SNMPv2-MIB)
sysLocation Laboratorio Docker
sysContact Professor / Aluno <gerencia@lab.local>
