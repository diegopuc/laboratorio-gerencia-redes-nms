name: laboratorio-librenms

x-nms: &nms
  build:
    context: ./nms
    dockerfile: Dockerfile
  image: gr-librenms:local
  cap_add: [NET_ADMIN, NET_RAW]
  env_file: librenms.env
  volumes: [nms:/data]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_started}
  restart: unless-stopped

x-device: &device
  build:
    context: ./dispositivos
    dockerfile: Dockerfile
  image: gr-dispositivo:local
  cap_add: [NET_ADMIN, NET_RAW]
  mem_limit: 256m
  cpus: 1.0
  restart: unless-stopped

services:
  db:
    image: mariadb:11.4
    command: [mariadbd, --innodb-file-per-table=1, --lower-case-table-names=0, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
      MARIADB_DATABASE: librenms
      MARIADB_USER: librenms
      MARIADB_PASSWORD: lab-db-local
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      rede-gerencia:
        ipv4_address: 172.28.0.2

  redis:
    image: redis:7.2-alpine
    networks:
      rede-gerencia:
        ipv4_address: 172.28.0.3

  librenms:
    <<: *nms
    hostname: librenms
    ports: ['127.0.0.1:${LIBRENMS_PORT:-18080}:8000']
    networks:
      rede-gerencia:
        ipv4_address: 172.28.0.10

  dispatcher:
    <<: *nms
    hostname: dispatcher
    environment:
      SIDECAR_DISPATCHER: '1'
      DISPATCHER_NODE_ID: dispatcher1
    depends_on: [librenms, redis]
    networks:
      rede-gerencia:
        ipv4_address: 172.28.0.4

  syslog:
    <<: *nms
    hostname: syslog
    environment:
      SIDECAR_SYSLOGNG: '1'
    depends_on: [librenms, redis]
    networks:
      rede-gerencia:
        ipv4_address: 172.28.0.5

  firewall:
    <<: *device
    hostname: firewall
    ports:
      - "${PORTA_PORTAL_WEB:-18088}:8080"
    networks:
      rede-gerencia:
        ipv4_address: 172.28.0.254
      rede-lan:
        ipv4_address: 172.28.1.254
      rede-dmz:
        ipv4_address: 172.28.2.254

  servidor1:
    <<: *device
    hostname: servidor1
    networks:
      rede-gerencia:
        ipv4_address: 172.28.0.11
      rede-lan:
        ipv4_address: 172.28.1.10

  servidor2:
    <<: *device
    hostname: servidor2
    networks:
      rede-gerencia:
        ipv4_address: 172.28.0.12
      rede-dmz:
        ipv4_address: 172.28.2.10

volumes:
  db:
  nms:

networks:
  rede-gerencia:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  rede-lan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
  rede-dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24
